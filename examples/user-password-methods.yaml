# Two ways to give a KubeFTPd User a password.
# Replace every "<change-me>" before applying. Do not commit real passwords.

---
# Secret holding the password (recommended for production)
apiVersion: v1
kind: Secret
metadata:
  name: user1-password
  namespace: default
type: Opaque
stringData:
  password: "<change-me>"

---
# User with a Secret-based password (recommended)
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: user1-secret
  namespace: default
spec:
  username: "user1"
  passwordSecret:
    name: "user1-password"
    key: "password"          # optional, defaults to "password"
    # namespace: "default"   # optional, defaults to the User's namespace
  backend:
    kind: MinioBackend
    name: my-minio-backend
  homeDirectory: "/home/user1"
  enabled: true
  permissions:
    read: true
    write: true
    delete: false
    list: true

---
# User with a plaintext password (development only; rejected in production namespaces)
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: user2-plaintext
  namespace: default
spec:
  username: "user2"
  password: "<change-me>"
  backend:
    kind: MinioBackend
    name: my-minio-backend
  homeDirectory: "/home/user2"
  enabled: true
  permissions:
    read: true
    write: true
    delete: false
    list: true

---
# Secret with a custom key name
apiVersion: v1
kind: Secret
metadata:
  name: user3-credentials
  namespace: default
type: Opaque
stringData:
  ftp-password: "<change-me>"

---
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: user3-custom-key
  namespace: default
spec:
  username: "user3"
  passwordSecret:
    name: "user3-credentials"
    key: "ftp-password"     # custom key name
  backend:
    kind: MinioBackend
    name: my-minio-backend
  homeDirectory: "/home/user3"
  enabled: true
