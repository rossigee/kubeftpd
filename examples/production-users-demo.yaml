# Production-style user management.
# Replace every "<change-me>" with a generated password before applying.
# Do not commit real passwords to git.

---
# Namespace for FTP users and their password Secrets
apiVersion: v1
kind: Namespace
metadata:
  name: ftp-users
  labels:
    purpose: ftp-user-management
    environment: production   # enables the production password rules

---
# RBAC: ServiceAccount the KubeFTPd controller runs as, if it reads Secrets from this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeftpd-secret-reader
  namespace: ftp-users

---
# RBAC: read access to password Secrets.
# Kubernetes matches resourceNames exactly, so list each Secret the controller may read.
# Without resourceNames, the rule covers every Secret in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ftp-users
  name: ftp-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["john-doe-ftp-password", "api-service-credentials"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeftpd-secret-access
  namespace: ftp-users
subjects:
  - kind: ServiceAccount
    name: kubeftpd-secret-reader
    namespace: ftp-users
roleRef:
  kind: Role
  name: ftp-secret-reader
  apiGroup: rbac.authorization.k8s.io

---
# Password Secret for a human user
apiVersion: v1
kind: Secret
metadata:
  name: john-doe-ftp-password
  namespace: ftp-users
  labels:
    user: john-doe
    purpose: ftp-authentication
  annotations:
    rotation-schedule: "quarterly"
type: Opaque
stringData:
  password: "<change-me>"

---
# Secret for a service account, with a custom key name
apiVersion: v1
kind: Secret
metadata:
  name: api-service-credentials
  namespace: ftp-users
  labels:
    user: api-service
    purpose: automated-ftp-access
type: Opaque
stringData:
  ftp-access-key: "<change-me>"

---
# Human user with a Secret-based password
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: john-doe
  namespace: ftp-users
  labels:
    user-type: human
    department: marketing
spec:
  username: "john.doe"
  passwordSecret:
    name: "john-doe-ftp-password"
    key: "password"
  backend:
    kind: MinioBackend
    name: production-storage
    namespace: default
  homeDirectory: "/marketing/john-doe"
  enabled: true
  permissions:
    read: true
    write: true
    delete: false      # no delete permission for humans by default
    list: true

---
# Service account user with a custom Secret key
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: api-service
  namespace: ftp-users
  labels:
    user-type: service
    department: engineering
spec:
  username: "api-service"
  passwordSecret:
    name: "api-service-credentials"
    key: "ftp-access-key"
  backend:
    kind: MinioBackend
    name: production-storage
    namespace: default
  homeDirectory: "/api-uploads"
  enabled: true
  permissions:
    read: true
    write: true
    delete: true
    list: true

---
# Development user with a plaintext password.
# Plaintext is rejected in namespaces labelled environment=production, so this
# user only works in a development namespace. Create "dev-sandbox" first
# (kubectl create namespace dev-sandbox), or change the namespace.
apiVersion: ftp.golder.org/v1
kind: User
metadata:
  name: dev-test-user
  namespace: dev-sandbox
  labels:
    user-type: development
spec:
  username: "dev.test"
  password: "<change-me>"
  backend:
    kind: FilesystemBackend
    name: dev-storage
    namespace: default
  homeDirectory: "/dev-sandbox"
  enabled: true
  permissions:
    read: true
    write: true
    delete: true
    list: true

---
# Scrape the HTTP Service, which carries the metrics endpoint
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubeftpd-metrics
  namespace: kubeftpd-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeftpd
      app.kubernetes.io/component: http
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
