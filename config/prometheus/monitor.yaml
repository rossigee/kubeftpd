---
# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubeftpd
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # Verifies the manager's metrics certificate against the CA that cert-manager
        # issues into the 'metrics-server-cert' secret. Prerequisite: enable the
        # [CERTMANAGER] section in config/default/kustomization.yaml, which mounts
        # that secret into the manager. Without it the manager serves a certificate
        # this CA does not sign, and Prometheus will not scrape the endpoint.
        serverName: kubeftpd-controller-manager-metrics-service.kubeftpd-system.svc
        ca:
          secret:
            name: metrics-server-cert
            key: ca.crt
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kubeftpd
