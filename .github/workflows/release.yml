---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Trigger on tags with semantic versioning

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Full CI on the tagged commit. Nothing is published unless these pass.
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Install kustomize
        run: |
          make kustomize

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build release binaries
        run: |
          mkdir -p dist/binaries
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-w -s -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD)"

          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/binaries/kubeftpd-linux-amd64 cmd/main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/binaries/kubeftpd-linux-arm64 cmd/main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/binaries/kubeftpd-darwin-amd64 cmd/main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/binaries/kubeftpd-darwin-arm64 cmd/main.go

          cd dist/binaries && sha256sum ./* > checksums.txt

      - name: Generate manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          mkdir -p dist
          cat config/crd/bases/*.yaml > dist/crds.yaml
          cd config/manager && ../../bin/kustomize edit set image controller="$IMAGE"
          ../../bin/kustomize build ../default > ../../dist/kubeftpd.yaml

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Set build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        timeout-minutes: 40
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.0

      - name: Package and push Helm chart to OCI
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm package charts/kubeftpd -d dist
          printf '%s' "$PAT_TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm push dist/kubeftpd-*.tgz "oci://$REGISTRY/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')/charts"
          helm registry logout "$REGISTRY"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/crds.yaml
            dist/kubeftpd.yaml
            dist/kubeftpd-*.tgz
            dist/binaries/*
